name: CI & Quality Assurance

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-build:
    name: Build, Lint & Verify Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate --workspace=@ai-study/api

      - name: Run Domain & Scheduling Engine Unit Tests
        run: npm test --workspace=@ai-study/domain

      - name: Run Backend Integration & API Tests
        run: npm test --workspace=@ai-study/api

      - name: Compile Production Web Assets
        run: npm run build --workspace=@ai-study/web
