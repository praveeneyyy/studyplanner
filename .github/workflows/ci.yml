name: CI & Quality Assurance

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-build:
    name: Build, Lint & Verify Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client & Migrate Database
        run: |
          npm run db:generate --workspace=@ai-study/api
          npm run db:push --workspace=@ai-study/api
          npm run db:seed --workspace=@ai-study/api
        env:
          DATABASE_URL: "file:./dev.db"
          JWT_SECRET: "super_secret_ai_smart_study_planner_jwt_key_2026_xyz"

      - name: Run Domain & Scheduling Engine Unit Tests
        run: npm test --workspace=@ai-study/domain

      - name: Run Backend Integration & API Tests
        run: npm test --workspace=@ai-study/api
        env:
          DATABASE_URL: "file:./dev.db"
          JWT_SECRET: "super_secret_ai_smart_study_planner_jwt_key_2026_xyz"

      - name: Compile Production Web Assets
        run: npm run build --workspace=@ai-study/web
