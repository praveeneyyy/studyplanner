services:
  - type: web
    name: ai-study-planner
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: HF_MODEL_ID
        value: Qwen/Qwen3-4B-Instruct-2507
      - key: HF_TOKEN
        sync: false
